
name: Secure AI Application CI Pipeline

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  security-checks:
    name: Four Security Gates
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements_pinned.txt

      - name: Gate 1 - Bandit SAST
        run: |
          bandit -r . -x ./venv,./.git -ll

      - name: Gate 2 - Dependency Audit
        run: |
          pip-audit -r requirements_pinned.txt

      - name: Gate 3 - Gitleaks Secret Detection
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Gate 4 - AI Injection Scanner
        run: |
          python inject_scanner.py .
